[package]
name = "nix-snake"
description = "A NixOS themed classic snake game with screensaver mode & gameplay mode"
version = "0.2.2"
edition = "2024"
authors = ["T. Sawyer <saylesss87@proton.me"]
repository = "https://github.com/saylesss88/nix-snake"
readme = "README.md"
keywords = ["rust", "terminal", "screensaver", "game"]
homepage = "https://github.com/saylesss88/nix-snake"
license = "Apache-2.0"
categories = ["command-line-utilities"]
exclude = ["result", "docs/*", ".github/", ".gitignore", "flake.nix", "flake.lock", "assets/*"]

[dependencies]
crossterm = "0.29.0"
rand = "0.10.0"
clap = "4.5.54"
hashbrown = "0.16.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
overflow-checks = false
debug = false
